        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <style>
        #header{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    z-index:9999;

    background:none;
    box-shadow:none;
    border:none;
    padding:0;

    text-align:center;

    font-family:"Poppins","Segoe UI",sans-serif;

    pointer-events:none;
}
#header h2{

    margin:0;

    font-size:20px;

    font-weight:700;

    color:#222;

    letter-spacing:1px;

    text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff,
         0px  0px 8px rgba(255,255,255,.9);

}

#header p{

    margin-top:3px;

    font-size:13px;

    font-weight:500;

    color:#333;

    text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff;

}

.data-source{
    display:flex;
    flex-direction:column;
    line-height:1.3;
}

.data-source .title{
    font-weight:700;
    font-size:13px;
}

.data-source .text{
    font-size:12px;
    color:#666;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    height:clamp(28px,4vw,42px);
    transition:.3s;
}

.brand img:hover{
    transform:scale(1.08);
}

.brand-text{
    font-size:clamp(11px,1.5vw,15px);
    font-weight:700;
    white-space:nowrap;
}
        </style>
        <style>
            #header,
#info-panel{

    animation:fadeUp .8s;
}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}
        </style>
        <style>
@media (max-width: 768px){

   #header{

    top:12px;

    left:50%;

    transform:translateX(-50%);

}

#header h2{

    font-size:16px;

}

#header p{

    font-size:11px;

}

   #info-panel{

    left:10px;

    right:10px;

    bottom:10px;

    padding:8px 10px;

    border-radius:12px;

    flex-direction:column;

    gap:6px;

    align-items:center;

}

    .brand{

    gap:8px;

}

.brand img{

    height:24px;

}

.brand-text{

    font-size:12px;

}

.data-source{

    text-align:center;

}

.data-source .title{

    display:none;

}

.data-source .text{

    font-size:10px;

}

}
        </style>
        <title>WebGIS Desa Keteleng</title>
    </head>

        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
            <div id="header">
            <h2>WEBGIS DESA KETELENG</h2>
            <p>Kecamatan Blado, Kabupaten Batang</p>
            </div>
        <div id="info-panel">

    <div class="brand">

        <img src="img/batang.png">

        <img src="img/kkn.png">

        <img src="img/tim.png">

        <div class="brand-text">
            KKN-PPM UGM 2026
        </div>

    </div>

</div>

    </body>
</html>
