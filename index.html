<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/ol-geocoder.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <style>
        #header{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    z-index:9999;

    padding:12px 30px;

    background:rgba(255,255,255,.75);

    backdrop-filter:blur(10px);

    border-radius:20px;

    box-shadow:0 8px 20px rgba(0,0,0,.15);

    text-align:center;

    font-family:"Segoe UI",sans-serif;
}

#header h2{
    margin:0;
    font-size:clamp(16px,2vw,22px);
    letter-spacing:1px;
}

#header p{
    margin-top:3px;
    color:#666;
}
        </style>
        <style>
        #info-panel{
    position:absolute;
    right:20px;
    bottom:18px;
    z-index:9999;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:25px;

    padding:10px 18px;

    background:rgba(255,255,255,.78);
    backdrop-filter:blur(10px);

    border-radius:16px;

    box-shadow:0 8px 25px rgba(0,0,0,.18);

    font-family:"Segoe UI",sans-serif;

    color:#2f2f2f;
}

.data-source{
    display:flex;
    flex-direction:column;
    line-height:1.3;
}

.data-source .title{
    font-weight:700;
    font-size:13px;
}

.data-source .text{
    font-size:12px;
    color:#666;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    height:clamp(28px,4vw,42px);
    transition:.3s;
}

.brand img:hover{
    transform:scale(1.08);
}

.brand-text{
    font-size:clamp(11px,1.5vw,15px);
    font-weight:700;
    white-space:nowrap;
}
        </style>
        <style>
            #header,
#info-panel{

    animation:fadeUp .8s;
}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}
        </style>
        <style>
@media (max-width: 768px){

    #header{
        width:85%;
        padding:10px 15px;
    }

    #header h2{
        font-size:17px;
    }

    #header p{
        font-size:12px;
    }

    #info-panel{

        left:10px;
        right:10px;
        bottom:10px;

        width:auto;

        padding:10px;

        gap:10px;

        flex-wrap:wrap;

        justify-content:center;
    }

    .brand{

        width:100%;

        justify-content:center;

        order:1;
    }

    .data-source{

        width:100%;

        text-align:center;

        order:2;
    }

    .brand img{

        height:30px;
    }

    .brand-text{

        font-size:13px;
    }

    .data-source .title{

        font-size:12px;
    }

    .data-source .text{

        font-size:11px;
    }

}
        </style>
        <title>WebGIS Desa Keteleng</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
            <div id="header">
            <h2>WEBGIS DESA KETELENG</h2>
            <p>Kecamatan Blado, Kabupaten Batang</p>
            </div>
        <div id="info-panel">

    <div class="data-source">

        <div class="title">
            Sumber Data
        </div>

        <div class="text">
            RBI BIG • Survei Lapangan 2026
        </div>

    </div>

    <div class="brand">

        <img src="img/batang.png">

        <img src="img/kkn.png">

        <img src="img/tim.png">

        <div class="brand-text">
            KKN-PPM UGM 2026
        </div>

    </div>

</div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/ol-geocoder.js"></script>
        <script src="layers/SUNGAI_2.js"></script><script src="layers/JALAN_3.js"></script><script src="layers/KONTURKETINGGIANmdpl_4.js"></script><script src="layers/SARANAIBADAH_5.js"></script><script src="layers/PEMERINTAHAN_6.js"></script><script src="layers/PENDIDIKAN_7.js"></script><script src="layers/KESEHATAN_8.js"></script><script src="layers/BATASDESAKETELENG_9.js"></script><script src="layers/PADUKUHAN_10.js"></script><script src="layers/RTRW_11.js"></script>
        <script src="styles/SUNGAI_2_style.js"></script><script src="styles/JALAN_3_style.js"></script><script src="styles/KONTURKETINGGIANmdpl_4_style.js"></script><script src="styles/SARANAIBADAH_5_style.js"></script><script src="styles/PEMERINTAHAN_6_style.js"></script><script src="styles/PENDIDIKAN_7_style.js"></script><script src="styles/KESEHATAN_8_style.js"></script><script src="styles/BATASDESAKETELENG_9_style.js"></script><script src="styles/PADUKUHAN_10_style.js"></script><script src="styles/RTRW_11_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
    </body>
</html>
