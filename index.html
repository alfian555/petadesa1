        html, body {
            background-color: #ffffff;

            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }

        <title>WEBGIS DESA KETELENG</title>
        <!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* ==========================
   HEADER
========================== */

.map-title{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;

    text-align:center;
    pointer-events:none;
}

.map-title h1{

    margin:0;

    font-family:'Poppins',sans-serif;

    font-size:24px;

    font-weight:700;

    color:white;

    letter-spacing:1px;

    -webkit-text-stroke:1px #1b1b1b;

    text-shadow:
        2px 2px 0 #1b1b1b,
        -2px 2px 0 #1b1b1b,
        2px -2px 0 #1b1b1b,
        -2px -2px 0 #1b1b1b,
        0px 3px 8px rgba(0,0,0,.4);

}

.map-title p{

    margin-top:4px;

    font-family:'Poppins',sans-serif;

    font-size:12px;

    font-weight:500;

    color:white;

    text-shadow:
        1px 1px 4px rgba(0,0,0,.9);

}



/* ==========================
   FOOTER LOGO
========================== */

.footer-logo{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    z-index:9999;

    background:rgba(255,255,255,.75);

    backdrop-filter:blur(4px);

    padding:10px 18px;

    border-radius:15px;

    box-shadow:0 3px 10px rgba(0,0,0,.2);

    text-align:center;

}

.logo-row{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:18px;

    margin-bottom:8px;

}

.logo-row img{

    width:55px;

    height:55px;

    object-fit:contain;

}

.footer-logo span{

    font-family:'Poppins',sans-serif;

    font-size:17px;

    font-weight:600;

    color:#222;

}



/* ==========================
   MOBILE
========================== */

@media (max-width:768px){

.map-title{

    top:10px;

    width:90%;

}

.map-title h1{

    font-size:18px;

    line-height:1.2;

}

.map-title p{

    font-size:10px;

}

.footer-logo{

    bottom:10px;

    padding:6px 12px;

    gap:8px;

}

.footer-logo img{

    width:30px;

    height:30px;

}

.footer-logo span{

    font-size:12px;

}

}

</style>
    </head>
    <body>
        <!-- ================= HEADER ================= -->

<div class="map-title">

    <h1>WEBGIS DESA KETELENG</h1>

    <p>Kecamatan Blado, Kabupaten Batang</p>

</div>


<!-- ================= FOOTER ================= -->

<div class="footer-logo">

    <div class="logo-row">

        <img src="images/logo_batang.png">

        <img src="images/logo_kkn.png">

        <img src="images/logo_tim.png">
        <span>KKN-PPM UGM 2026</span>

    </div>
</div>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
